[project]
name = "vmgs"
version = "0.1.0"
description = "仮想移動緑化シミュレータ"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "stzn", email = "sztk1209@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.6.12",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langsmith>=0.14.11",
    "matplotlib>=3.11.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
vmgs = "vmgs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-bdd>=9.0.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: 実LLM/実APIを呼ぶテスト（既定では除外）",
    "eval: LLM判断品質の確率的評価（既定では除外）",
]
addopts = "-m 'not live and not eval'"
bdd_features_base_dir = "tests/features"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
