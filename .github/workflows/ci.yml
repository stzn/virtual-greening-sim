name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      # LLM を呼ぶ評価（eval）と live は pyproject の addopts で除外される。API キーは不要
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests evals scripts
      - run: uv run pytest -q
